<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pong Game</h1>
        <div class="instructions">
            <p>Use W/S keys to move left paddle | Arrow Up/Down for right paddle</p>
            <p>First to 5 points wins!</p>
        </div>
        <canvas id="pongCanvas" width="800" height="600"></canvas>
        <div class="score">
            <div class="player1-score">Player 1: <span id="player1Score">0</span></div>
            <div class="player2-score">Player 2: <span id="player2Score">0</span></div>
        </div>
        <button id="resetButton">Reset Game</button>
    </div>
    <script src="pong.js"></script>
</body>
</html>
