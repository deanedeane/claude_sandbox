<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DownShift Icon Generator</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1410;
            color: #D4AF37;
        }
        h1 {
            text-align: center;
        }
        .canvas-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .canvas-item {
            text-align: center;
        }
        canvas {
            border: 2px solid #D4AF37;
            display: block;
            margin: 10px auto;
        }
        button {
            background: #D4AF37;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            opacity: 0.8;
        }
        .controls {
            text-align: center;
            margin: 30px 0;
        }
        small {
            color: #8B7355;
        }
    </style>
</head>
<body>
    <h1>DownShift Icon Generator</h1>
    <p style="text-align: center;">Generate placeholder icons for your DownShift PWA</p>

    <div class="controls">
        <button onclick="generateIcons()">Generate Icons</button>
        <button onclick="downloadAll()">Download All</button>
        <br><br>
        <small>Click "Generate Icons" to create placeholder icons, then "Download All" to save them.</small>
    </div>

    <div class="canvas-container" id="canvas-container"></div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const canvases = {};

        function createCanvases() {
            const container = document.getElementById('canvas-container');
            container.innerHTML = '';

            sizes.forEach(size => {
                const item = document.createElement('div');
                item.className = 'canvas-item';

                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                canvas.id = `canvas-${size}`;

                const label = document.createElement('div');
                label.textContent = `${size}×${size}`;
                label.style.marginTop = '10px';
                label.style.fontSize = '14px';

                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = 'Download';
                downloadBtn.style.fontSize = '12px';
                downloadBtn.style.padding = '6px 12px';
                downloadBtn.onclick = () => downloadIcon(size);

                item.appendChild(canvas);
                item.appendChild(label);
                item.appendChild(downloadBtn);
                container.appendChild(item);

                canvases[size] = canvas;
            });
        }

        function generateIcons() {
            Object.entries(canvases).forEach(([size, canvas]) => {
                const ctx = canvas.getContext('2d');
                const s = parseInt(size);

                // Background
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, s, s);

                // Draw simple moon and stretch icon
                ctx.strokeStyle = '#D4AF37';
                ctx.fillStyle = '#D4AF37';

                // Moon (crescent)
                const centerX = s * 0.35;
                const centerY = s * 0.3;
                const radius = s * 0.15;

                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(centerX + radius * 0.5, centerY - radius * 0.2, radius * 0.9, 0, Math.PI * 2);
                ctx.fill();

                // Stick figure in stretch pose
                ctx.strokeStyle = '#D4AF37';
                ctx.lineWidth = s * 0.015;
                ctx.lineCap = 'round';

                const figureY = s * 0.7;
                const figureX = s * 0.5;
                const headRadius = s * 0.08;
                const bodyHeight = s * 0.2;

                // Head
                ctx.beginPath();
                ctx.arc(figureX, figureY - bodyHeight - headRadius, headRadius, 0, Math.PI * 2);
                ctx.stroke();

                // Body
                ctx.beginPath();
                ctx.moveTo(figureX, figureY - bodyHeight);
                ctx.lineTo(figureX, figureY);
                ctx.stroke();

                // Arms (stretched up and out)
                ctx.beginPath();
                ctx.moveTo(figureX, figureY - bodyHeight * 0.7);
                ctx.lineTo(figureX - s * 0.15, figureY - bodyHeight * 1.3);
                ctx.moveTo(figureX, figureY - bodyHeight * 0.7);
                ctx.lineTo(figureX + s * 0.15, figureY - bodyHeight * 1.3);
                ctx.stroke();

                // Legs
                ctx.beginPath();
                ctx.moveTo(figureX, figureY);
                ctx.lineTo(figureX - s * 0.08, figureY + s * 0.15);
                ctx.moveTo(figureX, figureY);
                ctx.lineTo(figureX + s * 0.08, figureY + s * 0.15);
                ctx.stroke();
            });
        }

        function downloadIcon(size) {
            const canvas = canvases[size];
            const link = document.createElement('a');
            link.download = `icon-${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadAll() {
            sizes.forEach(size => {
                setTimeout(() => downloadIcon(size), size); // Stagger downloads
            });
        }

        // Initialize on load
        createCanvases();
        generateIcons();
    </script>
</body>
</html>
